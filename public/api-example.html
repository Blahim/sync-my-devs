<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple d'intégration API Portfolio</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #dc143c, #ba55d3);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1, h2 {
            color: #dc143c;
        }
        .skills-grid, .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: linear-gradient(145deg, #fff, #f3e5f9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            color: #dc143c;
            margin: 0 0 10px 0;
        }
        .skill-level {
            color: #ba55d3;
            font-weight: 600;
        }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        .loading {
            text-align: center;
            color: #dc143c;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Exemple d'intégration API Portfolio</h1>
        <p>Copiez ce code dans votre portfolio HTML pour afficher automatiquement vos compétences et projets !</p>

        <h2>📚 Mes Compétences</h2>
        <div id="skills" class="skills-grid">
            <div class="loading">Chargement des compétences...</div>
        </div>

        <h2>💼 Mes Projets</h2>
        <div id="projects" class="projects-grid">
            <div class="loading">Chargement des projets...</div>
        </div>
    </div>

    <script>
        // ⚠️ REMPLACEZ l'URL ci-dessous par votre URL Lovable Cloud
        const API_URL = 'https://mliyjddfantnoniwtruy.supabase.co/functions/v1/portfolio-api';

        // Fonction pour charger les compétences
        async function loadSkills() {
            try {
                const response = await fetch(`${API_URL}?type=skills`);
                const skills = await response.json();
                
                const skillsContainer = document.getElementById('skills');
                skillsContainer.innerHTML = skills.map(skill => `
                    <div class="card">
                        <h3>${skill.name}</h3>
                        <p class="skill-level">Niveau: ${skill.level}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('skills').innerHTML = 
                    '<p style="color: red;">Erreur de chargement des compétences</p>';
            }
        }

        // Fonction pour charger les projets
        async function loadProjects() {
            try {
                const response = await fetch(`${API_URL}?type=projects`);
                const projects = await response.json();
                
                const projectsContainer = document.getElementById('projects');
                projectsContainer.innerHTML = projects.map(project => `
                    <div class="card">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('projects').innerHTML = 
                    '<p style="color: red;">Erreur de chargement des projets</p>';
            }
        }

        // Charger tout au chargement de la page
        async function loadAll() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Afficher les compétences
                const skillsContainer = document.getElementById('skills');
                skillsContainer.innerHTML = data.skills.map(skill => `
                    <div class="card">
                        <h3>${skill.name}</h3>
                        <p class="skill-level">Niveau: ${skill.level}</p>
                    </div>
                `).join('');

                // Afficher les projets
                const projectsContainer = document.getElementById('projects');
                projectsContainer.innerHTML = data.projects.map(project => `
                    <div class="card">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        // Démarrer le chargement
        loadAll();
    </script>
</body>
</html>
